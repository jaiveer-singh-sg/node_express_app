trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Define your variables for reusability
  serviceConnectionName: 'Azure-FreeTier-Space' # <-- Check that this matches your Service Connection name
  webAppName: 'my-node-app'                     # <-- Your Azure Web App name
  nodeVersion: '18.x'

stages:
- stage: Build
  displayName: 'Build and Package Stage'
  jobs:
  - job: BuildJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: 'Install Node.js'

    - script: |
        npm install
        npm run build --if-present
        npm test --if-present
      workingDirectory: '$(System.DefaultWorkingDirectory)/application' # <-- ADD THIS LINE (Change 'Application' to match your actual subfolder name if it differs)
      displayName: 'Install Dependencies & Run Tests'

    # Archive files into a production-ready deployment ZIP package
    - task: ArchiveFiles@2
      displayName: 'Archive Files into Zip'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    # Publish the ZIP package so the subsequent Deploy stage can access it
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy to Azure Stage'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    # Download the ZIP package built in the previous stage
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    # Deploy the code straight to your free-tier Azure App Service Web App
    - task: AzureWebApp@1
      displayName: 'Deploy Node.js Application to Azure'
      inputs:
        azureSubscription: '$(serviceConnectionName)'
        appType: 'webAppLinux'
        appName: '$(webAppName)'
        package: '$(System.ArtifactsDirectory)/drop/$(Build.BuildId).zip'
        startUpCommand: 'npm start' # Tells Azure Linux container how to boot your Node server
